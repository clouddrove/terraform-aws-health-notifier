  - name: IAM Role Module
    url: https://github.com/clouddrove/terraform-aws-iam-role
    description: Scoped Lambda execution role.

# Description of this project
description: |-
  Turn AWS Health EC2 scheduled events (maintenance, retirement, reboots) into
  tracked tickets across an AWS Organization. One event fans out to Jira, GitHub
  Issues, and Linear; each sink is deduped and auto-closed independently.

# How to use this project
usage: |-
  ### Linear only
  ```hcl
  module "aws_health_notifier" {
    source  = "clouddrove/health-notifier/aws"
    version = "1.0.0"

    name        = "aws-health-notifier"
    environment = "prod"

    notifiers         = "linear"
    linear_team_key   = "OPS"
    linear_secret_arn = "<linear-secret-arn>"
  }
  ```

  ### All three sinks
  ```hcl
  module "aws_health_notifier" {
    source  = "clouddrove/health-notifier/aws"
    version = "1.0.0"

    name        = "aws-health-notifier"
    environment = "prod"

    notifiers = "jira,github,linear"

    jira_project_key  = "OPS"
    github_repo       = "clouddrove/your-repo"
    linear_team_key   = "OPS"

    jira_secret_arn   = "<jira-secret-arn>"
    github_secret_arn = "<github-secret-arn>"
    linear_secret_arn = "<linear-secret-arn>"
  }
  ```
