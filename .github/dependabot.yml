version: 2

updates:
  # GitHub Actions used in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Terraform providers (aws, archive) and the clouddrove modules, in the module
  # root and in every example.
  - package-ecosystem: terraform
    directories:
      - /
      - /examples/*
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]

  # Dev/CI Python tooling declared in pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Dev/CI Docker base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
