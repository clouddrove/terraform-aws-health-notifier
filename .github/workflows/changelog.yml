---
name: changelog
permissions:
  contents: write
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: "Existing release tag (eg: v1.0.0) to regenerate the changelog for"
jobs:
  changelog:
    uses: clouddrove/github-shared-workflows/.github/workflows/release-changelog.yml@v2
    with:
      branch: 'main'
      tag_format: 'vX.Y.Z'
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      GITHUB: ${{ secrets.GITHUB_TOKEN }}
...
